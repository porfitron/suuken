<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#1a1b20"/>
      <stop offset="70%" stop-color="#0d0e12"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="34%" r="42%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffcc00" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGold" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffcc00" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#ffcc00" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="divider" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#4e4632" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9a9078"/>
      <stop offset="100%" stop-color="#4e4632" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#goldGlow)"/>
  <!-- Corner thumb zones -->
  <circle cx="108" cy="108" r="52" fill="#1f1f24" stroke="#ff00ff" stroke-width="5"/>
  <circle cx="1092" cy="108" r="52" fill="#1f1f24" stroke="#ff00ff" stroke-width="5"/>
  <circle cx="108" cy="522" r="52" fill="#1f1f24" stroke="#00f1fe" stroke-width="5"/>
  <circle cx="1092" cy="522" r="52" fill="#1f1f24" stroke="#00f1fe" stroke-width="5"/>
  <g transform="translate(600 248) skewX(-15)" filter="url(#neonGold)">
    <text text-anchor="middle" dominant-baseline="middle" font-family="Anybody, sans-serif" font-size="132" font-weight="900" font-style="italic" fill="#ffcc00" letter-spacing="-0.04em">KINKEDA</text>
  </g>
  <rect x="360" y="318" width="480" height="2" fill="url(#divider)"/>
  <text x="600" y="372" text-anchor="middle" font-family="Hanken Grotesk, sans-serif" font-size="30" font-weight="400" fill="#d2c5ab">2-player thumb-guessing game on one shared screen</text>
  <text x="600" y="560" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700" fill="#f1c100" letter-spacing="0.08em">KINKEDA.COM</text>
</svg>
