<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Suuken — 2-player thumb-guessing game on one shared screen" />
  <title>Suuken</title>
  <script>
    (function enforceHttps() {
      if (window.location.protocol !== 'http:') return;
      const host = window.location.hostname;
      const isLocalhost = host === 'localhost' || host === '127.0.0.1' || host === '[::1]';
      if (isLocalhost) return;
      window.location.replace(`https://${window.location.host}${window.location.pathname}${window.location.search}${window.location.hash}`);
    }());
  </script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B90DQQ81ZW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-B90DQQ81ZW');
  </script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    .corner {
      position: absolute;
      width: clamp(88px, 28vw, 160px);
      height: clamp(88px, 28vw, 160px);
      border-radius: 50%;
      border: 3px solid #334155;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, opacity 0.3s;
      z-index: 2;
    }

    .corner.inactive {
      opacity: 0.25;
      pointer-events: none;
      background: #0f172a;
      border-color: #1e293b;
    }

    .corner.pressed {
      background: #f59e0b;
      border-color: #fbbf24;
      box-shadow: 0 0 32px rgba(245, 158, 11, 0.55);
    }

    .corner.p1 { bottom: env(safe-area-inset-bottom, 12px); }
    .corner.p2 {
      top: env(safe-area-inset-top, 12px);
      transform: rotate(180deg);
    }
    .corner.left { left: env(safe-area-inset-left, 12px); }
    .corner.right { right: env(safe-area-inset-right, 12px); }

    .corner-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      opacity: 0.6;
      position: absolute;
      bottom: 18%;
    }

    #board {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 420px);
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.25rem;
      text-align: center;
      z-index: 3;
      pointer-events: none;
    }

    #board > * { pointer-events: auto; }

    #board.flip {
      transform: translate(-50%, -50%) rotate(180deg);
    }

    .player-tag {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .player-tag.active { color: #f59e0b; }

    h1 {
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .phase-msg {
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: 600;
      line-height: 1.3;
    }

    .countdown {
      font-size: clamp(4rem, 18vw, 7rem);
      font-weight: 800;
      color: #f59e0b;
      line-height: 1;
    }

    .guess-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      max-width: 100%;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      touch-action: manipulation;
    }

    .guess-btn {
      min-width: 3rem;
      height: 3rem;
      padding: 0 0.75rem;
      background: #334155;
      color: #f8fafc;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .guess-btn:active { background: #475569; }

    .primary-btn {
      padding: 0.85rem 1.5rem;
      background: #f59e0b;
      color: #0f0f1a;
      font-weight: 700;
      font-size: 1rem;
    }

    .primary-btn:active { background: #fbbf24; }

    .ghost-btn {
      padding: 0.85rem 1.5rem;
      background: transparent;
      color: #cbd5e1;
      border: 1px solid #475569;
      font-weight: 700;
      font-size: 1rem;
    }

    .ghost-btn:active {
      background: rgba(71, 85, 105, 0.25);
      color: #f8fafc;
    }

    .secondary-btn {
      padding: 0.65rem 1.25rem;
      background: #334155;
      color: #e2e8f0;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .result {
      font-size: 1rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .result strong { color: #f59e0b; }

    .eliminate-hint {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }

    #install-banner {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 0.5rem;
      align-items: center;
      padding: 0.5rem 0.75rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 999px;
      z-index: 10;
      font-size: 0.8rem;
    }

    #install-banner.visible { display: flex; }

    .divider {
      width: 60%;
      height: 1px;
      background: #334155;
      margin: 0.25rem 0;
    }

    .start-rules {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.6;
      max-width: 280px;
    }

    .name-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: min(280px, 85vw);
    }

    .name-field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      text-align: left;
    }

    .name-field label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .name-field input {
      font: inherit;
      padding: 0.65rem 0.85rem;
      border: 2px solid #334155;
      border-radius: 10px;
      background: #1e293b;
      color: #f8fafc;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      touch-action: manipulation;
    }

    .name-field input:focus {
      outline: none;
      border-color: #f59e0b;
    }

    .name-field input::placeholder {
      color: #64748b;
      font-weight: 400;
    }

    .name-input-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .name-input-row input {
      flex: 1;
      min-width: 0;
    }

    .cpu-toggle {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: #cbd5e1;
      white-space: nowrap;
    }

    .cpu-toggle input {
      width: 1rem;
      height: 1rem;
      accent-color: #f59e0b;
    }

    .session-score {
      font-size: 0.95rem;
      font-weight: 600;
      color: #cbd5e1;
      letter-spacing: 0.02em;
    }

    .session-score strong {
      color: #fbbf24;
      font-weight: 800;
    }

    .session-score.celebration-score {
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      margin-top: 0.25rem;
    }

    .session-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .session-primary-actions {
      display: flex;
      gap: 0.6rem;
    }

    .text-btn {
      padding: 0.35rem 0.5rem;
      background: transparent;
      color: #64748b;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .text-btn:active { color: #94a3b8; }

    #app.idle .corner,
    #app.setup .corner {
      opacity: 0.4;
      pointer-events: none;
    }

    #about-modal {
      position: fixed;
      inset: 0;
      z-index: 45;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 23, 0.76);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      padding: 1rem;
    }

    #about-modal.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .about-modal-card {
      width: min(420px, 92vw);
      background: #111827;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 1rem 1rem 0.9rem;
      text-align: left;
      box-shadow: 0 20px 45px rgba(2, 6, 23, 0.5);
    }

    .about-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .about-modal-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #f8fafc;
    }

    .about-modal-close {
      width: 2rem;
      height: 2rem;
      border-radius: 999px;
      background: #1f2937;
      color: #cbd5e1;
      font-size: 1.15rem;
      line-height: 1;
      border: 1px solid #334155;
    }

    .about-modal-body {
      color: #cbd5e1;
      font-size: 0.92rem;
      line-height: 1.6;
    }

    #celebration {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1a 70%);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s;
      overflow: hidden;
      padding: 2rem;
      text-align: center;
    }

    #celebration.visible {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s ease, visibility 0s;
    }

    #celebration.flip {
      transform: rotate(180deg);
    }

    .celebration-burst {
      position: absolute;
      width: 120vmax;
      height: 120vmax;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.25) 0%, transparent 60%);
      animation: burst-pulse 2s ease-out infinite;
      pointer-events: none;
    }

    @keyframes burst-pulse {
      0%, 100% { transform: scale(0.6); opacity: 0.6; }
      50% { transform: scale(1); opacity: 1; }
    }

    .celebration-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      animation: winner-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes winner-pop {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .celebration-emoji {
      font-size: clamp(4rem, 16vw, 6rem);
      line-height: 1;
      animation: trophy-bounce 1s ease-in-out 0.5s infinite alternate;
    }

    @keyframes trophy-bounce {
      from { transform: translateY(0) rotate(-5deg); }
      to { transform: translateY(-12px) rotate(5deg); }
    }

    .celebration-label {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #fbbf24;
    }

    .celebration-winner {
      font-size: clamp(2.5rem, 12vw, 4.5rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fbbf24, #f59e0b, #fcd34d);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .celebration-sub {
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      color: #cbd5e1;
      font-weight: 500;
    }

    .celebration-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      margin-top: 1rem;
      animation: btn-fade-in 0.5s ease 1.2s both;
      position: relative;
      z-index: 2;
    }

    #celebration.flip .celebration-actions {
      transform: rotate(180deg);
    }

    #celebration .primary-btn {
      font-size: 1.1rem;
      padding: 1rem 2.5rem;
    }

    #celebration .secondary-btn {
      font-size: 0.95rem;
      padding: 0.75rem 1.75rem;
    }

    #celebration-share-btn[disabled] {
      opacity: 0.55;
      cursor: wait;
    }

    @keyframes btn-fade-in {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .confetti-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      top: -10px;
      width: 10px;
      height: 10px;
      opacity: 0;
      animation: confetti-fall linear forwards;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0.3; }
    }

    .target-history {
      position: absolute;
      left: calc(env(safe-area-inset-left, 0px) + 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
    }

    .target-history.visible { opacity: 1; }

    .target-history.p1 {
      top: auto;
      bottom: calc(env(safe-area-inset-bottom, 0px) + clamp(96px, 28vw, 168px));
      transform: none;
    }

    .target-history.p2 {
      left: auto;
      right: calc(env(safe-area-inset-right, 0px) + 24px);
      top: calc(env(safe-area-inset-top, 0px) + clamp(96px, 28vw, 168px));
      bottom: auto;
      transform: rotate(180deg);
    }

    .target-history-item {
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      background: #1e293b;
      border: 2px solid #334155;
      color: #94a3b8;
      flex-shrink: 0;
    }

    .target-history-item.recent {
      background: #422006;
      border-color: #f59e0b;
      color: #fbbf24;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.35);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="corner-p1-left" class="corner p1 left" data-corner="p1Left" aria-label="Player 1 left thumb">
      <span class="corner-label">P1</span>
      👍
    </div>
    <div id="corner-p1-right" class="corner p1 right" data-corner="p1Right" aria-label="Player 1 right thumb">
      <span class="corner-label">P1</span>
      👍
    </div>
    <div id="corner-p2-left" class="corner p2 left" data-corner="p2Left" aria-label="Player 2 left thumb">
      <span class="corner-label">P2</span>
      👍
    </div>
    <div id="corner-p2-right" class="corner p2 right" data-corner="p2Right" aria-label="Player 2 right thumb">
      <span class="corner-label">P2</span>
      👍
    </div>

    <aside id="history-p1" class="target-history p1" aria-label="Recent target numbers for bottom player" hidden></aside>
    <aside id="history-p2" class="target-history p2" aria-label="Recent target numbers for top player" hidden></aside>

    <main id="board" aria-live="polite"></main>
  </div>

  <div id="celebration" aria-hidden="true" role="dialog" aria-label="Winner celebration">
    <div class="celebration-burst" aria-hidden="true"></div>
    <div class="confetti-container" id="confetti-container" aria-hidden="true"></div>
    <div class="celebration-content">
      <span class="celebration-emoji" aria-hidden="true">🏆</span>
      <p class="celebration-label">Winner</p>
      <p class="celebration-winner" id="celebration-winner"></p>
      <p class="celebration-sub">First to put both thumbs down!</p>
      <p class="session-score celebration-score" id="celebration-session-score" hidden></p>
      <div class="celebration-actions">
        <button type="button" class="primary-btn" id="celebration-start-btn">Re-match</button>
        <button type="button" class="secondary-btn" id="celebration-share-btn">Share Results</button>
        <button type="button" class="secondary-btn" id="celebration-new-players-btn">New player(s)</button>
      </div>
    </div>
  </div>

  <div id="about-modal" aria-hidden="true">
    <div class="about-modal-card" role="dialog" aria-modal="true" aria-labelledby="about-title">
      <div class="about-modal-head">
        <h2 class="about-modal-title" id="about-title">About Suuken</h2>
        <button type="button" class="about-modal-close" id="about-close-btn" aria-label="Close about dialog">✕</button>
      </div>
      <p class="about-modal-body">Developed in equal partnership by Porfiirio, Michael, Toni and Laetitia. No personal data is collected; no cookies are set. (c) 2026 https://porfir.io/sukken</p>
    </div>
  </div>

  <div id="install-banner">
    <span>Install Suuken</span>
    <button type="button" class="secondary-btn" id="install-btn">Add to Home Screen</button>
    <button type="button" class="secondary-btn" id="dismiss-install" aria-label="Dismiss">✕</button>
  </div>

  <script>
    const CORNERS = ['p1Left', 'p1Right', 'p2Left', 'p2Right'];
    const P1_CORNERS = ['p1Left', 'p1Right'];
    const P2_CORNERS = ['p2Left', 'p2Right'];
    const KEY_TO_CORNER = {
      ':': 'p1Left',
      ';': 'p1Left',
      "'": 'p1Right',
      a: 'p2Left',
      s: 'p2Right'
    };
    const TARGET_HISTORY_MAX = 10;

    const state = {
      turn: 'P1',
      phase: 'SETUP',
      playerNames: { P1: '', P2: '' },
      lastHumanP2Name: '',
      cpuEnabled: false,
      activeCorners: { p1Left: true, p1Right: true, p2Left: true, p2Right: true },
      pressedCorners: { p1Left: false, p1Right: false, p2Left: false, p2Right: false },
      targetTotal: null,
      lastTotal: 0,
      roundSuccess: false,
      thumbDropped: false,
      winner: null,
      currentMatchRounds: 0,
      countdownTimer: null,
      actionTimer: null,
      touchIds: new Map(),
    };

    const sessionRecord = { P1: 0, P2: 0 };
    const targetHistory = [];

    const board = document.getElementById('board');
    const historyP1 = document.getElementById('history-p1');
    const historyP2 = document.getElementById('history-p2');
    const app = document.getElementById('app');
    const celebration = document.getElementById('celebration');
    const confettiContainer = document.getElementById('confetti-container');
    const aboutModal = document.getElementById('about-modal');
    const cornerEls = Object.fromEntries(
      CORNERS.map((id) => [id, document.querySelector(`[data-corner="${id}"]`)])
    );

    const CONFETTI_COLORS = ['#f59e0b', '#fbbf24', '#818cf8', '#34d399', '#f472b6', '#60a5fa', '#fcd34d'];

    function trackAnalyticsEvent(eventName, params = {}) {
      if (typeof window.gtag !== 'function') return;
      window.gtag('event', eventName, params);
    }

    function getPlayerName(player) {
      const name = state.playerNames[player]?.trim();
      return name || player;
    }

    function getPlayerTag(player) {
      const pos = player === 'P1' ? 'bottom' : 'top';
      return `${getPlayerName(player)} (${pos})`;
    }

    function abbrevName(name) {
      return name.length <= 8 ? name : `${name.slice(0, 7)}…`;
    }

    function totalSessionGames() {
      return sessionRecord.P1 + sessionRecord.P2;
    }

    function formatSessionScore() {
      const p1 = getPlayerName('P1');
      const p2 = getPlayerName('P2');
      return `${p1} <strong>${sessionRecord.P1}</strong> – <strong>${sessionRecord.P2}</strong> ${p2}`;
    }

    function recordSessionWin(winner) {
      sessionRecord[winner] += 1;
    }

    function resetSessionRecord() {
      sessionRecord.P1 = 0;
      sessionRecord.P2 = 0;
    }

    function updateCelebrationSessionScore() {
      const el = document.getElementById('celebration-session-score');
      if (!el) return;
      if (totalSessionGames() === 0) {
        el.hidden = true;
        el.textContent = '';
        return;
      }
      el.hidden = false;
      el.innerHTML = `Session: ${formatSessionScore()}`;
    }

    function updateCornerLabels() {
      document.querySelectorAll('.corner.p1 .corner-label').forEach((el) => {
        el.textContent = abbrevName(getPlayerName('P1'));
      });
      document.querySelectorAll('.corner.p2 .corner-label').forEach((el) => {
        el.textContent = abbrevName(getPlayerName('P2'));
      });
      CORNERS.forEach((id) => {
        const player = P1_CORNERS.includes(id) ? 'P1' : 'P2';
        const side = id.includes('Left') ? 'left' : 'right';
        cornerEls[id].setAttribute(
          'aria-label',
          `${getPlayerName(player)} ${side} thumb`
        );
      });
    }

    function readNamesFromForm() {
      const p1Input = document.getElementById('p1-name');
      const p2Input = document.getElementById('p2-name');

      state.cpuEnabled = Boolean(cpuInput?.checked);

      const p2Input = document.getElementById('p2-name');

      const cpuChecked = cpuInput.checked;

    function canvasText(ctx, text, x, y, opts = {}) {
      const {
        size = 24,
        weight = '600',
        color = '#e2e8f0',
        align = 'center',
        maxWidth,
      } = opts;
      ctx.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = 'middle';
      if (maxWidth) {
        ctx.fillText(text, x, y, maxWidth);
      } else {
        ctx.fillText(text, x, y);
      }
    }

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, opts = {}) {
      const {
        size = 24,
        weight = '600',
        color = '#e2e8f0',
        align = 'center',
      } = opts;
      ctx.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = 'middle';

      const words = text.split(' ');
      const lines = [];
      let line = '';
      for (const word of words) {
        const test = line ? `${line} ${word}` : word;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      const startY = y - ((lines.length - 1) * lineHeight) / 2;
      lines.forEach((ln, i) => {
        canvasText(ctx, ln, x, startY + i * lineHeight, opts);
      });
    }

    function drawResultsImage() {
      const winner = state.winner;
      if (!winner) return Promise.resolve(null);

      const winnerName = getPlayerName(winner);
      const p1Name = getPlayerName('P1');
      const p2Name = getPlayerName('P2');
      const sub = `${winnerName} put both thumbs down first!`;
      const hasSession = totalSessionGames() > 0;

      const canvas = document.createElement('canvas');
      const scale = 2;
      const w = 600;
      const h = hasSession ? 820 : 760;
      canvas.width = w * scale;
      canvas.height = h * scale;
      const ctx = canvas.getContext('2d');
      ctx.scale(scale, scale);

      const bg = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * 0.75);
      bg.addColorStop(0, '#1a1a2e');
      bg.addColorStop(1, '#0f0f1a');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      const glow = ctx.createRadialGradient(w / 2, 220, 0, w / 2, 220, 220);
      glow.addColorStop(0, 'rgba(245, 158, 11, 0.22)');
      glow.addColorStop(1, 'rgba(245, 158, 11, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);

      canvasText(ctx, '🏆', w / 2, 150, { size: 88 });
      canvasText(ctx, 'WINNER', w / 2, 250, {
        size: 18,
        weight: '700',
        color: '#fbbf24',
      });

      const titleGrad = ctx.createLinearGradient(w / 2 - 180, 0, w / 2 + 180, 0);
      titleGrad.addColorStop(0, '#fbbf24');
      titleGrad.addColorStop(0.5, '#f59e0b');
      titleGrad.addColorStop(1, '#fcd34d');
      ctx.font = '900 52px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = titleGrad;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${winnerName} Wins!`, w / 2, 330);

      wrapCanvasText(ctx, sub, w / 2, 410, w - 80, 34, {
        size: 22,
        weight: '500',
        color: '#cbd5e1',
      });

      if (hasSession) {
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(80, 490);
        ctx.lineTo(w - 80, 490);
        ctx.stroke();

        canvasText(ctx, 'Session', w / 2, 540, {
          size: 16,
          weight: '700',
          color: '#94a3b8',
        });
        canvasText(ctx, `${p1Name}  ${sessionRecord.P1} – ${sessionRecord.P2}  ${p2Name}`, w / 2, 590, {
          size: 28,
          weight: '800',
          color: '#fbbf24',
          maxWidth: w - 60,
        });
      }

      canvasText(ctx, 'Suuken', w / 2, h - 68, {
        size: 20,
        weight: '800',
        color: '#64748b',
      });
      canvasText(ctx, 'https://porfir.io/suuken', w / 2, h - 36, {
        size: 16,
        weight: '600',
        color: '#475569',
      });

      return new Promise((resolve) => {
        canvas.toBlob((blob) => resolve(blob), 'image/png');
      });
    }

    async function shareResults() {
      const btn = document.getElementById('celebration-share-btn');
      if (!btn || btn.disabled) return;

      btn.disabled = true;
      const prevLabel = btn.textContent;
      btn.textContent = 'Preparing…';

      try {
        const blob = await drawResultsImage();
        if (!blob) return;

        const file = new File([blob], 'suuken-results.png', { type: 'image/png' });
        const shareData = {
          files: [file],
          title: 'Suuken Results',
          text: `${getPlayerName(state.winner)} wins!`,
        };

        if (navigator.share && (!navigator.canShare || navigator.canShare(shareData))) {
          await navigator.share(shareData);
        } else {
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'suuken-results.png';
          link.click();
          URL.revokeObjectURL(url);
        }
      } catch (err) {
        if (err?.name !== 'AbortError') {
          console.error('Share failed:', err);
        }
      } finally {
        btn.disabled = false;
        btn.textContent = prevLabel;
      }
    }

    function startNewPlayersSession() {
      clearInterval(state.countdownTimer);
      clearTimeout(state.actionTimer);
      hideCelebration();
      resetSessionRecord();
      state.turn = 'P1';
      state.phase = 'SETUP';
      state.winner = null;
      state.targetTotal = null;
      state.roundSuccess = false;
      state.thumbDropped = false;
      state.cpuEnabled = false;
      state.playerNames.P1 = '';
      state.playerNames.P2 = '';
      state.lastHumanP2Name = '';
      CORNERS.forEach((c) => {
        state.activeCorners[c] = true;
        state.pressedCorners[c] = false;
      });
      clearTargetHistory();
      syncCornerUI();
      updateCornerLabels();
      renderBoard();
    }

    function countActiveCorners() {
      return CORNERS.filter((c) => state.activeCorners[c]).length;
    }

    function countActiveForPlayer(player) {
      const list = player === 'P1' ? P1_CORNERS : P2_CORNERS;
      return list.filter((c) => state.activeCorners[c]).length;
    }

    function tallyPressed() {
      return CORNERS.filter((c) => state.activeCorners[c] && state.pressedCorners[c]).length;
    }

    function resetPressed() {
      CORNERS.forEach((c) => { state.pressedCorners[c] = false; });
      syncCornerUI();
    }

    function syncCornerUI() {
      CORNERS.forEach((id) => {
        const el = cornerEls[id];
        el.classList.toggle('inactive', !state.activeCorners[id]);
        el.classList.toggle('pressed', state.pressedCorners[id]);
      });
    }

    function recordTargetHistory(total) {
      targetHistory.unshift(total);
      if (targetHistory.length > TARGET_HISTORY_MAX) {
        targetHistory.length = TARGET_HISTORY_MAX;
      }
      updateTargetHistoryUI(true);
    }

    function clearTargetHistory() {
      targetHistory.length = 0;
      updateTargetHistoryUI();
    }

    function buildHistoryItem(value, isRecent) {
      const span = document.createElement('span');
      span.className = `target-history-item${isRecent ? ' recent' : ''}`;
      span.textContent = String(value);
      return span;
    }

    function getHistoryDisplayValues() {
      return [...targetHistory].reverse();
    }

    function renderHistoryContainer(container, animateInsert) {
      const inGame = state.phase !== 'SETUP' && state.phase !== 'GAMEOVER';
      const displayValues = getHistoryDisplayValues();
      container.hidden = !inGame || displayValues.length === 0;
      container.classList.toggle('visible', inGame && displayValues.length > 0);

      if (!inGame || displayValues.length === 0) {
        container.replaceChildren();
        return;
      }

      const canAnimate = animateInsert
        && container.children.length > 0
        && typeof container.animate === 'function';

      if (canAnimate) {
        const prevRects = [...container.children].map((el) => el.getBoundingClientRect());
        const oldLen = prevRects.length;
        container.replaceChildren();
        displayValues.forEach((value, index) => {
          container.appendChild(buildHistoryItem(value, index === displayValues.length - 1));
        });

        const newLen = container.children.length;
        const droppedOldest = oldLen > 0 && newLen === oldLen;

        [...container.children].forEach((el, index) => {
          const isNewest = index === newLen - 1;
          if (isNewest) {
            el.animate([
              { transform: 'translateY(130%) scale(0.8)', opacity: 0 },
              { transform: 'translateY(0) scale(1)', opacity: 1 },
            ], { duration: 460, easing: 'cubic-bezier(0.34, 1.25, 0.64, 1)' });
            return;
          }

          let fromRect;
          if (droppedOldest) {
            fromRect = prevRects[index + 1];
          } else if (index === newLen - 2) {
            fromRect = prevRects[oldLen - 1];
          } else {
            fromRect = prevRects[index];
          }

          if (!fromRect) return;
          const nextRect = el.getBoundingClientRect();
          const dx = fromRect.left - nextRect.left;
          const dy = fromRect.top - nextRect.top;
          if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
            el.animate([
              { transform: `translate(${dx}px, ${dy}px)` },
              { transform: 'translate(0, 0)' },
            ], { duration: 460, easing: 'cubic-bezier(0.34, 1.25, 0.64, 1)' });
          }
        });
        return;
      }

      container.replaceChildren();
      displayValues.forEach((value, index) => {
        container.appendChild(buildHistoryItem(value, index === displayValues.length - 1));
      });

      if (animateInsert && container.children.length === 1) {
        container.lastElementChild.animate([
          { transform: 'translateY(130%) scale(0.8)', opacity: 0 },
          { transform: 'translateY(0) scale(1)', opacity: 1 },
        ], { duration: 460, easing: 'cubic-bezier(0.34, 1.25, 0.64, 1)' });
      }
    }

    function updateTargetHistoryUI(animateInsert = false) {
      renderHistoryContainer(historyP1, animateInsert);
      renderHistoryContainer(historyP2, animateInsert);
    }

    function setPhase(phase) {
      state.phase = phase;
      if (phase !== 'ACTION') resetPressed();
      renderBoard();
    }

    function renderBoard() {
      updateTargetHistoryUI();
      app.classList.toggle('idle', state.phase === 'SETUP');
      app.classList.toggle('setup', state.phase === 'SETUP');
      const flip = state.turn === 'P2' && ['COUNTDOWN', 'RESOLUTION'].includes(state.phase);
      board.classList.toggle('flip', flip);

      if (state.phase === 'SETUP') {
        const sessionBlock = totalSessionGames() > 0
          ? `<p class="session-score">Session: ${formatSessionScore()}</p>`
          : '';
        board.innerHTML = `
          <h1>Suuken</h1>
          <p class="start-rules">Each player takes a side of the screen to choose how many thumbs to raise. Every round, guess the called number. If it's your turn and the total thumbs up matches, you win the round. Win the most rounds to take the match.</p>
          <div class="divider"></div>
          <div class="name-form">
            <div class="name-field">
              <label for="p1-name">Bottom player</label>
              <input type="text" id="p1-name" maxlength="20" placeholder="Player 1" autocomplete="nickname" enterkeyhint="next" value="${state.playerNames.P1.replace(/"/g, '&quot;')}" />
            </div>
            <div class="name-field">
              <label for="p2-name">Top player</label>
              <div class="name-input-row">
                <input type="text" id="p2-name" maxlength="20" placeholder="Player 2" autocomplete="nickname" enterkeyhint="go" value="${(state.cpuEnabled ? 'Computer' : state.playerNames.P2).replace(/"/g, '&quot;')}" ${state.cpuEnabled ? 'disabled' : ''} />
                <label class="cpu-toggle" for="p2-cpu">
                  <input type="checkbox" id="p2-cpu" ${state.cpuEnabled ? 'checked' : ''} />
                  CPU
                </label>
              </div>
            </div>
          </div>
          ${sessionBlock}
          <div class="session-actions">
            <div class="session-primary-actions">
              <button type="button" class="primary-btn" id="start-btn">Start</button>
              <button type="button" class="ghost-btn" id="about-btn">About</button>
            </div>
            ${totalSessionGames() > 0 ? '<button type="button" class="text-btn" id="reset-session-btn">Reset session record</button>' : ''}
          </div>
        `;
        document.getElementById('start-btn').onclick = beginGame;
        document.getElementById('about-btn').onclick = showAboutModal;
        const resetSessionBtn = document.getElementById('reset-session-btn');
        if (resetSessionBtn) {
          resetSessionBtn.onclick = () => {
            resetSessionRecord();
            renderBoard();
          };
        }
        document.getElementById('p2-name').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') beginGame();
        });
        const cpuToggle = document.getElementById('p2-cpu');
        if (cpuToggle) {
          cpuToggle.addEventListener('change', () => {
            state.cpuEnabled = cpuToggle.checked;
            if (state.cpuEnabled) {
              const p2Input = document.getElementById('p2-name');
              if (p2Input) {
                state.lastHumanP2Name = p2Input.value.trim();
              }
              state.playerNames.P2 = 'Computer';
            } else {
              state.playerNames.P2 = state.lastHumanP2Name;
            }
            syncCpuNameField();
          });
          syncCpuNameField();
        }
        return;
      }

      if (state.phase === 'GAMEOVER') {
        board.innerHTML = '';
        return;
      }

      const activeTag = getPlayerTag(state.turn);
      const p1Name = getPlayerName('P1');
      const p2Name = getPlayerName('P2');

      if (state.phase === 'COUNTDOWN') {
        board.innerHTML = `
          <p class="player-tag active">${activeTag}'s turn</p>
          <h1>Suuken</h1>
          <p class="countdown" id="countdown-num">3</p>
          <p class="phase-msg">Get ready…</p>
        `;
        return;
      }

      if (state.phase === 'ACTION') {
        board.innerHTML = `
          <p class="player-tag">${p1Name} & ${p2Name}</p>
          <p class="countdown" style="font-size: clamp(2.5rem, 12vw, 4rem);">GO!</p>
          <p class="phase-msg">Hold the corners you raise</p>
          <p class="result">Tally in 1 second…</p>
        `;
        return;
      }

      if (state.phase === 'RESOLUTION') {
        const { targetTotal, lastTotal, roundSuccess } = state;
        const playerCorners = state.turn === 'P1' ? P1_CORNERS : P2_CORNERS;
        const remaining = playerCorners.filter((c) => state.activeCorners[c]);
        const needsPick = roundSuccess && remaining.length > 1;
        let extra = '';
        if (needsPick) {
          extra = `<p class="eliminate-hint">${getPlayerName(state.turn)}: tap one of your corners to put it away</p>`;
        } else if (roundSuccess && state.thumbDropped) {
          extra = `<p class="result">One thumb put away.</p>`;
        }
        board.innerHTML = `
          <p class="player-tag active">${activeTag}</p>
          <p class="phase-msg">${roundSuccess ? 'Match!' : 'No match'}</p>
          <p class="result">
            Target was <strong>${targetTotal}</strong> — thumbs raised: <strong>${lastTotal}</strong>
          </p>
          ${extra}
          ${!needsPick ? '<button type="button" class="primary-btn" id="next-btn">Next Turn</button>' : ''}
        `;
        const next = document.getElementById('next-btn');
        if (next) next.onclick = nextTurn;
        return;
      }
    }

    function pickTargetTotal() {
      const max = countActiveCorners();
      return Math.floor(Math.random() * (max + 1));
    }

    function startPlayerTurn() {
      state.targetTotal = pickTargetTotal();
      setPhase('COUNTDOWN');
      let n = 3;
      const numEl = () => document.getElementById('countdown-num');
      clearInterval(state.countdownTimer);
      state.countdownTimer = setInterval(() => {
        n -= 1;
        if (n > 0) {
          const el = numEl();
          if (el) el.textContent = String(n);
        } else {
          clearInterval(state.countdownTimer);
          startActionPhase();
        }
      }, 800);
    }

    function startActionPhase() {
      resetPressed();
      if (state.cpuEnabled) {
        P2_CORNERS.forEach((corner) => {
          if (!state.activeCorners[corner]) return;
          state.pressedCorners[corner] = Math.random() < 0.5;
        });
      }
      syncCornerUI();
      setPhase('ACTION');
      clearTimeout(state.actionTimer);
      state.actionTimer = setTimeout(resolveRound, 1000);
    }

    function resolveRound() {
      const total = tallyPressed();
      state.lastTotal = total;
      state.roundSuccess = total === state.targetTotal;
      state.thumbDropped = false;
      state.currentMatchRounds += 1;

      if (state.roundSuccess) {
        const playerCorners = state.turn === 'P1' ? P1_CORNERS : P2_CORNERS;
        const active = playerCorners.filter((c) => state.activeCorners[c]);
        if (active.length === 1) {
          state.activeCorners[active[0]] = false;
          state.thumbDropped = true;
          syncCornerUI();
        } else if (state.cpuEnabled && state.turn === 'P2' && active.length > 1) {
          const randomCorner = active[Math.floor(Math.random() * active.length)];
          state.activeCorners[randomCorner] = false;
          state.thumbDropped = true;
          syncCornerUI();
        }
      }

      trackAnalyticsEvent('round_completed', {
        round_number: state.currentMatchRounds,
        turn_player: state.turn,
        target_total: state.targetTotal,
        raised_total: total,
        was_match: state.roundSuccess ? 1 : 0,
      });

      recordTargetHistory(state.targetTotal);
      if (checkWinner()) return;

      setPhase('RESOLUTION');
    }

    function eliminateCorner(cornerId) {
      if (state.phase !== 'RESOLUTION' || !state.roundSuccess) return;
      const playerCorners = state.turn === 'P1' ? P1_CORNERS : P2_CORNERS;
      if (!playerCorners.includes(cornerId) || !state.activeCorners[cornerId]) return;
      state.activeCorners[cornerId] = false;
      state.thumbDropped = true;
      syncCornerUI();
      if (checkWinner()) return;
      renderBoard();
    }

    function checkWinner() {
      const p1Out = !P1_CORNERS.some((c) => state.activeCorners[c]);
      const p2Out = !P2_CORNERS.some((c) => state.activeCorners[c]);
      if (p1Out) {
        state.winner = 'P1';
        state.phase = 'GAMEOVER';
        recordSessionWin('P1');
        trackAnalyticsEvent('match_completed', {
          winner: 'P1',
          rounds_played: state.currentMatchRounds,
          cpu_enabled: state.cpuEnabled ? 1 : 0,
          p1_session_wins: sessionRecord.P1,
          p2_session_wins: sessionRecord.P2,
        });
        showCelebration('P1');
        renderBoard();
        return true;
      }
      if (p2Out) {
        state.winner = 'P2';
        state.phase = 'GAMEOVER';
        recordSessionWin('P2');
        trackAnalyticsEvent('match_completed', {
          winner: 'P2',
          rounds_played: state.currentMatchRounds,
          cpu_enabled: state.cpuEnabled ? 1 : 0,
          p1_session_wins: sessionRecord.P1,
          p2_session_wins: sessionRecord.P2,
        });
        showCelebration('P2');
        renderBoard();
        return true;
      }
      return false;
    }

    function nextTurn() {
      clearInterval(state.countdownTimer);
      clearTimeout(state.actionTimer);
      state.turn = state.turn === 'P1' ? 'P2' : 'P1';
      state.targetTotal = null;
      state.roundSuccess = false;
      state.thumbDropped = false;
      startPlayerTurn();
    }

    function beginGame() {
      if (state.phase === 'SETUP') readNamesFromForm();
      hideCelebration();
      updateCelebrationSessionScore();
      clearInterval(state.countdownTimer);
      clearTimeout(state.actionTimer);
      state.turn = 'P1';
      state.winner = null;
      state.targetTotal = null;
      state.roundSuccess = false;
      state.thumbDropped = false;
      state.currentMatchRounds = 0;
      CORNERS.forEach((c) => {
        state.activeCorners[c] = true;
        state.pressedCorners[c] = false;
      });
      clearTargetHistory();
      syncCornerUI();
      startPlayerTurn();
    }

    function resetGame() {
      beginGame();
    }

    function cornerFromTouch(touch) {
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      return el?.closest('[data-corner]')?.dataset?.corner ?? null;
    }

    function cornerFromKeyEvent(e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return null;
      const key = e.key?.length === 1 ? e.key.toLowerCase() : e.key;
      return KEY_TO_CORNER[key] ?? null;
    }

    function shouldIgnoreKeyboardEvent(e) {
      const tag = e.target?.tagName;
      if (!tag) return false;
      if (e.target?.isContentEditable) return true;
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    }

    function setCornerPressed(cornerId, pressed) {
      if (!cornerId || state.phase !== 'ACTION') return;
      if (!state.activeCorners[cornerId]) return;
      if (state.cpuEnabled && P2_CORNERS.includes(cornerId)) return;
      state.pressedCorners[cornerId] = pressed;
      syncCornerUI();
    }

    function onTouchStart(e) {
      if (state.phase === 'RESOLUTION' && state.roundSuccess) {
        const corner = cornerFromTouch(e.changedTouches[0]);
        if (corner) { eliminateCorner(corner); e.preventDefault(); }
        return;
      }
      if (state.phase !== 'ACTION') return;
      e.preventDefault();
      for (const touch of e.changedTouches) {
        const corner = cornerFromTouch(touch);
        if (corner) {
          state.touchIds.set(touch.identifier, corner);
          setCornerPressed(corner, true);
        }
      }
    }

    function onTouchEnd(e) {
      if (state.phase !== 'ACTION') return;
      e.preventDefault();
      for (const touch of e.changedTouches) {
        const corner = state.touchIds.get(touch.identifier);
        state.touchIds.delete(touch.identifier);
        if (corner) setCornerPressed(corner, false);
      }
    }

    document.getElementById('app').addEventListener('touchstart', onTouchStart, { passive: false });
    document.getElementById('app').addEventListener('touchend', onTouchEnd, { passive: false });
    document.getElementById('app').addEventListener('touchcancel', onTouchEnd, { passive: false });

    document.addEventListener('keydown', (e) => {
      if (shouldIgnoreKeyboardEvent(e)) return;
      const corner = cornerFromKeyEvent(e);
      if (!corner) return;
      if (state.phase === 'ACTION') {
        e.preventDefault();
        setCornerPressed(corner, true);
        return;
      }
      if (state.phase === 'RESOLUTION' && state.roundSuccess) {
        e.preventDefault();
        eliminateCorner(corner);
      }
    });

    document.addEventListener('keyup', (e) => {
      if (shouldIgnoreKeyboardEvent(e)) return;
      const corner = cornerFromKeyEvent(e);
      if (!corner || state.phase !== 'ACTION') return;
      e.preventDefault();
      setCornerPressed(corner, false);
    });

    document.addEventListener('gesturestart', (e) => e.preventDefault());

    /* PWA install prompt */
    let deferredInstall = null;
    const banner = document.getElementById('install-banner');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstall = e;
      if (!localStorage.getItem('suuken-install-dismissed')) {
        banner.classList.add('visible');
      }
    });
    document.getElementById('install-btn').onclick = async () => {
      if (!deferredInstall) return;
      deferredInstall.prompt();
      await deferredInstall.userChoice;
      banner.classList.remove('visible');
      deferredInstall = null;
    };
    document.getElementById('dismiss-install').onclick = () => {
      banner.classList.remove('visible');
      localStorage.setItem('suuken-install-dismissed', '1');
    };

    /* Service worker */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    document.getElementById('celebration-start-btn').onclick = beginGame;
    document.getElementById('celebration-share-btn').onclick = shareResults;
    document.getElementById('celebration-new-players-btn').onclick = startNewPlayersSession;
    document.getElementById('about-close-btn').onclick = hideAboutModal;
    aboutModal.addEventListener('click', (e) => {
      if (e.target === aboutModal) hideAboutModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') hideAboutModal();
    });
    document.addEventListener('click', (e) => {
      const button = e.target.closest('button');
      if (!button) return;
      const buttonId = button.id || 'anonymous-button';
      const buttonLabel = (button.textContent || '')
        .trim()
        .toLowerCase()
        .replace(/\s+/g, '_')
        .slice(0, 40) || 'unlabeled';
      trackAnalyticsEvent('button_click', {
        button_id: buttonId,
        button_label: buttonLabel,
        phase: state.phase,
      });
    });

    updateCornerLabels();
    syncCornerUI();
    renderBoard();
  </script>
</body>
</html>
