<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Suuken — 2-player thumb-guessing game on one shared screen" />
  <title>Suuken</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    .corner {
      position: absolute;
      width: clamp(88px, 28vw, 160px);
      height: clamp(88px, 28vw, 160px);
      border-radius: 50%;
      border: 3px solid #334155;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, opacity 0.3s;
      z-index: 2;
    }

    .corner.inactive {
      opacity: 0.25;
      pointer-events: none;
      background: #0f172a;
      border-color: #1e293b;
    }

    .corner.pressed {
      background: #f59e0b;
      border-color: #fbbf24;
      box-shadow: 0 0 32px rgba(245, 158, 11, 0.55);
    }

    .corner.p1 { bottom: env(safe-area-inset-bottom, 12px); }
    .corner.p2 {
      top: env(safe-area-inset-top, 12px);
      transform: rotate(180deg);
    }
    .corner.left { left: env(safe-area-inset-left, 12px); }
    .corner.right { right: env(safe-area-inset-right, 12px); }

    .corner-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      opacity: 0.6;
      position: absolute;
      bottom: 18%;
    }

    #board {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 420px);
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.25rem;
      text-align: center;
      z-index: 3;
      pointer-events: none;
    }

    #board > * { pointer-events: auto; }

    #board.flip {
      transform: translate(-50%, -50%) rotate(180deg);
    }

    .player-tag {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .player-tag.active { color: #f59e0b; }

    h1 {
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .phase-msg {
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: 600;
      line-height: 1.3;
    }

    .countdown {
      font-size: clamp(4rem, 18vw, 7rem);
      font-weight: 800;
      color: #f59e0b;
      line-height: 1;
    }

    .guess-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      max-width: 100%;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      touch-action: manipulation;
    }

    .guess-btn {
      min-width: 3rem;
      height: 3rem;
      padding: 0 0.75rem;
      background: #334155;
      color: #f8fafc;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .guess-btn:active { background: #475569; }

    .primary-btn {
      padding: 0.85rem 1.5rem;
      background: #f59e0b;
      color: #0f0f1a;
      font-weight: 700;
      font-size: 1rem;
    }

    .primary-btn:active { background: #fbbf24; }

    .secondary-btn {
      padding: 0.65rem 1.25rem;
      background: #334155;
      color: #e2e8f0;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .result {
      font-size: 1rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .result strong { color: #f59e0b; }

    .eliminate-hint {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }

    #install-banner {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 0.5rem;
      align-items: center;
      padding: 0.5rem 0.75rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 999px;
      z-index: 10;
      font-size: 0.8rem;
    }

    #install-banner.visible { display: flex; }

    .divider {
      width: 60%;
      height: 1px;
      background: #334155;
      margin: 0.25rem 0;
    }

    .start-rules {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.6;
      max-width: 280px;
    }

    .name-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: min(280px, 85vw);
    }

    .name-field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      text-align: left;
    }

    .name-field label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .name-field input {
      font: inherit;
      padding: 0.65rem 0.85rem;
      border: 2px solid #334155;
      border-radius: 10px;
      background: #1e293b;
      color: #f8fafc;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      touch-action: manipulation;
    }

    .name-field input:focus {
      outline: none;
      border-color: #f59e0b;
    }

    .name-field input::placeholder {
      color: #64748b;
      font-weight: 400;
    }

    #app.idle .corner,
    #app.setup .corner {
      opacity: 0.4;
      pointer-events: none;
    }

    #celebration {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1a 70%);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s;
      overflow: hidden;
      padding: 2rem;
      text-align: center;
    }

    #celebration.visible {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.4s ease, visibility 0s;
    }

    #celebration.flip {
      transform: rotate(180deg);
    }

    .celebration-burst {
      position: absolute;
      width: 120vmax;
      height: 120vmax;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.25) 0%, transparent 60%);
      animation: burst-pulse 2s ease-out infinite;
      pointer-events: none;
    }

    @keyframes burst-pulse {
      0%, 100% { transform: scale(0.6); opacity: 0.6; }
      50% { transform: scale(1); opacity: 1; }
    }

    .celebration-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      animation: winner-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes winner-pop {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .celebration-emoji {
      font-size: clamp(4rem, 16vw, 6rem);
      line-height: 1;
      animation: trophy-bounce 1s ease-in-out 0.5s infinite alternate;
    }

    @keyframes trophy-bounce {
      from { transform: translateY(0) rotate(-5deg); }
      to { transform: translateY(-12px) rotate(5deg); }
    }

    .celebration-label {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #fbbf24;
    }

    .celebration-winner {
      font-size: clamp(2.5rem, 12vw, 4.5rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fbbf24, #f59e0b, #fcd34d);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .celebration-sub {
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      color: #cbd5e1;
      font-weight: 500;
    }

    #celebration .primary-btn {
      margin-top: 1rem;
      font-size: 1.1rem;
      padding: 1rem 2.5rem;
      animation: btn-fade-in 0.5s ease 1.2s both;
      position: relative;
      z-index: 2;
    }

    @keyframes btn-fade-in {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .confetti-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      top: -10px;
      width: 10px;
      height: 10px;
      opacity: 0;
      animation: confetti-fall linear forwards;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="corner-p1-left" class="corner p1 left" data-corner="p1Left" aria-label="Player 1 left thumb">
      <span class="corner-label">P1</span>
      👍
    </div>
    <div id="corner-p1-right" class="corner p1 right" data-corner="p1Right" aria-label="Player 1 right thumb">
      <span class="corner-label">P1</span>
      👍
    </div>
    <div id="corner-p2-left" class="corner p2 left" data-corner="p2Left" aria-label="Player 2 left thumb">
      <span class="corner-label">P2</span>
      👍
    </div>
    <div id="corner-p2-right" class="corner p2 right" data-corner="p2Right" aria-label="Player 2 right thumb">
      <span class="corner-label">P2</span>
      👍
    </div>

    <main id="board" aria-live="polite"></main>
  </div>

  <div id="celebration" aria-hidden="true" role="dialog" aria-label="Winner celebration">
    <div class="celebration-burst" aria-hidden="true"></div>
    <div class="confetti-container" id="confetti-container" aria-hidden="true"></div>
    <div class="celebration-content">
      <span class="celebration-emoji" aria-hidden="true">🏆</span>
      <p class="celebration-label">Winner</p>
      <p class="celebration-winner" id="celebration-winner"></p>
      <p class="celebration-sub">First to put both thumbs down!</p>
      <button type="button" class="primary-btn" id="celebration-start-btn">Start</button>
    </div>
  </div>

  <div id="install-banner">
    <span>Install Suuken</span>
    <button type="button" class="secondary-btn" id="install-btn">Add to Home Screen</button>
    <button type="button" class="secondary-btn" id="dismiss-install" aria-label="Dismiss">✕</button>
  </div>

  <script>
    const CORNERS = ['p1Left', 'p1Right', 'p2Left', 'p2Right'];
    const P1_CORNERS = ['p1Left', 'p1Right'];
    const P2_CORNERS = ['p2Left', 'p2Right'];

    const state = {
      turn: 'P1',
      phase: 'SETUP',
      playerNames: { P1: '', P2: '' },
      activeCorners: { p1Left: true, p1Right: true, p2Left: true, p2Right: true },
      pressedCorners: { p1Left: false, p1Right: false, p2Left: false, p2Right: false },
      targetTotal: null,
      lastTotal: 0,
      roundSuccess: false,
      winner: null,
      countdownTimer: null,
      actionTimer: null,
      touchIds: new Map(),
    };

    const board = document.getElementById('board');
    const app = document.getElementById('app');
    const celebration = document.getElementById('celebration');
    const confettiContainer = document.getElementById('confetti-container');
    const cornerEls = Object.fromEntries(
      CORNERS.map((id) => [id, document.querySelector(`[data-corner="${id}"]`)])
    );

    const CONFETTI_COLORS = ['#f59e0b', '#fbbf24', '#818cf8', '#34d399', '#f472b6', '#60a5fa', '#fcd34d'];

    function getPlayerName(player) {
      const name = state.playerNames[player]?.trim();
      return name || player;
    }

    function getPlayerTag(player) {
      const pos = player === 'P1' ? 'bottom' : 'top';
      return `${getPlayerName(player)} (${pos})`;
    }

    function abbrevName(name) {
      return name.length <= 8 ? name : `${name.slice(0, 7)}…`;
    }

    function updateCornerLabels() {
      document.querySelectorAll('.corner.p1 .corner-label').forEach((el) => {
        el.textContent = abbrevName(getPlayerName('P1'));
      });
      document.querySelectorAll('.corner.p2 .corner-label').forEach((el) => {
        el.textContent = abbrevName(getPlayerName('P2'));
      });
      CORNERS.forEach((id) => {
        const player = P1_CORNERS.includes(id) ? 'P1' : 'P2';
        const side = id.includes('Left') ? 'left' : 'right';
        cornerEls[id].setAttribute(
          'aria-label',
          `${getPlayerName(player)} ${side} thumb`
        );
      });
    }

    function readNamesFromForm() {
      const p1Input = document.getElementById('p1-name');
      const p2Input = document.getElementById('p2-name');
      if (p1Input) state.playerNames.P1 = p1Input.value.trim();
      if (p2Input) state.playerNames.P2 = p2Input.value.trim();
      updateCornerLabels();
    }

    function spawnConfetti() {
      confettiContainer.replaceChildren();
      for (let i = 0; i < 90; i += 1) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
        piece.style.animationDuration = `${2.5 + Math.random() * 2.5}s`;
        piece.style.animationDelay = `${Math.random() * 1.5}s`;
        const size = 6 + Math.random() * 8;
        piece.style.width = `${size}px`;
        piece.style.height = `${size * (0.6 + Math.random() * 0.8)}px`;
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        confettiContainer.appendChild(piece);
      }
    }

    function showCelebration(winner) {
      const name = getPlayerName(winner);
      document.getElementById('celebration-winner').textContent = `${name} Wins!`;
      celebration.querySelector('.celebration-sub').textContent =
        `${name} put both thumbs down first!`;
      celebration.classList.toggle('flip', winner === 'P2');
      celebration.setAttribute('aria-label', `${name} wins`);
      spawnConfetti();
      const content = celebration.querySelector('.celebration-content');
      content.style.animation = 'none';
      void content.offsetHeight;
      content.style.animation = '';
      celebration.classList.add('visible');
      celebration.setAttribute('aria-hidden', 'false');
    }

    function hideCelebration() {
      celebration.classList.remove('visible', 'flip');
      celebration.setAttribute('aria-hidden', 'true');
      celebration.setAttribute('aria-label', 'Winner celebration');
      celebration.querySelector('.celebration-sub').textContent =
        'First to put both thumbs down!';
      confettiContainer.replaceChildren();
    }

    function countActiveCorners() {
      return CORNERS.filter((c) => state.activeCorners[c]).length;
    }

    function countActiveForPlayer(player) {
      const list = player === 'P1' ? P1_CORNERS : P2_CORNERS;
      return list.filter((c) => state.activeCorners[c]).length;
    }

    function tallyPressed() {
      return CORNERS.filter((c) => state.activeCorners[c] && state.pressedCorners[c]).length;
    }

    function resetPressed() {
      CORNERS.forEach((c) => { state.pressedCorners[c] = false; });
      syncCornerUI();
    }

    function syncCornerUI() {
      CORNERS.forEach((id) => {
        const el = cornerEls[id];
        el.classList.toggle('inactive', !state.activeCorners[id]);
        el.classList.toggle('pressed', state.pressedCorners[id]);
      });
    }

    function setPhase(phase) {
      state.phase = phase;
      if (phase !== 'ACTION') resetPressed();
      renderBoard();
    }

    function renderBoard() {
      app.classList.toggle('idle', state.phase === 'SETUP');
      app.classList.toggle('setup', state.phase === 'SETUP');
      const flip = state.turn === 'P2' && ['COUNTDOWN', 'RESOLUTION'].includes(state.phase);
      board.classList.toggle('flip', flip);

      if (state.phase === 'SETUP') {
        board.innerHTML = `
          <h1>Suuken</h1>
          <p class="start-rules">Two players, one screen. Match the target tally to remove your thumbs. First to put both down wins.</p>
          <div class="divider"></div>
          <div class="name-form">
            <div class="name-field">
              <label for="p1-name">Bottom player</label>
              <input type="text" id="p1-name" maxlength="20" placeholder="Player 1" autocomplete="nickname" enterkeyhint="next" value="${state.playerNames.P1.replace(/"/g, '&quot;')}" />
            </div>
            <div class="name-field">
              <label for="p2-name">Top player</label>
              <input type="text" id="p2-name" maxlength="20" placeholder="Player 2" autocomplete="nickname" enterkeyhint="go" value="${state.playerNames.P2.replace(/"/g, '&quot;')}" />
            </div>
          </div>
          <button type="button" class="primary-btn" id="start-btn">Start</button>
        `;
        document.getElementById('start-btn').onclick = beginGame;
        document.getElementById('p2-name').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') beginGame();
        });
        return;
      }

      if (state.phase === 'GAMEOVER') {
        board.innerHTML = '';
        return;
      }

      const activeTag = getPlayerTag(state.turn);
      const p1Name = getPlayerName('P1');
      const p2Name = getPlayerName('P2');

      if (state.phase === 'COUNTDOWN') {
        board.innerHTML = `
          <p class="player-tag active">${activeTag}'s turn</p>
          <h1>Suuken</h1>
          <p class="countdown" id="countdown-num">3</p>
          <p class="phase-msg">Get ready…</p>
        `;
        return;
      }

      if (state.phase === 'ACTION') {
        board.innerHTML = `
          <p class="player-tag">${p1Name} & ${p2Name}</p>
          <p class="countdown" style="font-size: clamp(2.5rem, 12vw, 4rem);">GO!</p>
          <p class="phase-msg">Hold the corners you raise</p>
          <p class="result">Tally in 1 second…</p>
        `;
        return;
      }

      if (state.phase === 'RESOLUTION') {
        const { targetTotal, lastTotal, roundSuccess } = state;
        const playerCorners = state.turn === 'P1' ? P1_CORNERS : P2_CORNERS;
        const remaining = playerCorners.filter((c) => state.activeCorners[c]);
        const needsPick = roundSuccess && remaining.length > 1;
        let extra = '';
        if (roundSuccess && remaining.length === 1) {
          extra = `<p class="result">Last thumb removed.</p>`;
        } else if (needsPick) {
          extra = `<p class="eliminate-hint">${getPlayerName(state.turn)}: tap one of your corners to put it away</p>`;
        }
        board.innerHTML = `
          <p class="player-tag active">${activeTag}</p>
          <p class="phase-msg">${roundSuccess ? 'Match!' : 'No match'}</p>
          <p class="result">
            Target was <strong>${targetTotal}</strong> — thumbs raised: <strong>${lastTotal}</strong>
          </p>
          ${extra}
          ${!needsPick ? '<button type="button" class="primary-btn" id="next-btn">Next Turn</button>' : ''}
        `;
        const next = document.getElementById('next-btn');
        if (next) next.onclick = nextTurn;
        return;
      }
    }

    function pickTargetTotal() {
      const max = countActiveCorners();
      return Math.floor(Math.random() * (max + 1));
    }

    function startPlayerTurn() {
      state.targetTotal = pickTargetTotal();
      setPhase('COUNTDOWN');
      let n = 3;
      const numEl = () => document.getElementById('countdown-num');
      clearInterval(state.countdownTimer);
      state.countdownTimer = setInterval(() => {
        n -= 1;
        if (n > 0) {
          const el = numEl();
          if (el) el.textContent = String(n);
        } else {
          clearInterval(state.countdownTimer);
          startActionPhase();
        }
      }, 800);
    }

    function startActionPhase() {
      resetPressed();
      setPhase('ACTION');
      clearTimeout(state.actionTimer);
      state.actionTimer = setTimeout(resolveRound, 1000);
    }

    function resolveRound() {
      const total = tallyPressed();
      state.lastTotal = total;
      state.roundSuccess = total === state.targetTotal;
      setPhase('RESOLUTION');

      if (state.roundSuccess) {
        const playerCorners = state.turn === 'P1' ? P1_CORNERS : P2_CORNERS;
        const active = playerCorners.filter((c) => state.activeCorners[c]);
        if (active.length === 1) {
          state.activeCorners[active[0]] = false;
          syncCornerUI();
          checkWinner();
        }
      }
    }

    function eliminateCorner(cornerId) {
      if (state.phase !== 'RESOLUTION' || !state.roundSuccess) return;
      const playerCorners = state.turn === 'P1' ? P1_CORNERS : P2_CORNERS;
      if (!playerCorners.includes(cornerId) || !state.activeCorners[cornerId]) return;
      state.activeCorners[cornerId] = false;
      syncCornerUI();
      checkWinner();
      if (state.phase !== 'GAMEOVER') nextTurn();
      else renderBoard();
    }

    function checkWinner() {
      const p1Out = !P1_CORNERS.some((c) => state.activeCorners[c]);
      const p2Out = !P2_CORNERS.some((c) => state.activeCorners[c]);
      if (p1Out) {
        state.winner = 'P1';
        state.phase = 'GAMEOVER';
        showCelebration('P1');
        renderBoard();
      } else if (p2Out) {
        state.winner = 'P2';
        state.phase = 'GAMEOVER';
        showCelebration('P2');
        renderBoard();
      }
    }

    function nextTurn() {
      clearInterval(state.countdownTimer);
      clearTimeout(state.actionTimer);
      state.turn = state.turn === 'P1' ? 'P2' : 'P1';
      state.targetTotal = null;
      state.roundSuccess = false;
      startPlayerTurn();
    }

    function beginGame() {
      if (state.phase === 'SETUP') readNamesFromForm();
      hideCelebration();
      clearInterval(state.countdownTimer);
      clearTimeout(state.actionTimer);
      state.turn = 'P1';
      state.winner = null;
      state.targetTotal = null;
      state.roundSuccess = false;
      CORNERS.forEach((c) => {
        state.activeCorners[c] = true;
        state.pressedCorners[c] = false;
      });
      syncCornerUI();
      startPlayerTurn();
    }

    function resetGame() {
      beginGame();
    }

    function cornerFromTouch(touch) {
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      return el?.closest('[data-corner]')?.dataset?.corner ?? null;
    }

    function setCornerPressed(cornerId, pressed) {
      if (!cornerId || state.phase !== 'ACTION') return;
      if (!state.activeCorners[cornerId]) return;
      state.pressedCorners[cornerId] = pressed;
      syncCornerUI();
    }

    function onTouchStart(e) {
      if (state.phase === 'RESOLUTION' && state.roundSuccess) {
        const corner = cornerFromTouch(e.changedTouches[0]);
        if (corner) { eliminateCorner(corner); e.preventDefault(); }
        return;
      }
      if (state.phase !== 'ACTION') return;
      e.preventDefault();
      for (const touch of e.changedTouches) {
        const corner = cornerFromTouch(touch);
        if (corner) {
          state.touchIds.set(touch.identifier, corner);
          setCornerPressed(corner, true);
        }
      }
    }

    function onTouchEnd(e) {
      if (state.phase !== 'ACTION') return;
      e.preventDefault();
      for (const touch of e.changedTouches) {
        const corner = state.touchIds.get(touch.identifier);
        state.touchIds.delete(touch.identifier);
        if (corner) setCornerPressed(corner, false);
      }
    }

    document.getElementById('app').addEventListener('touchstart', onTouchStart, { passive: false });
    document.getElementById('app').addEventListener('touchend', onTouchEnd, { passive: false });
    document.getElementById('app').addEventListener('touchcancel', onTouchEnd, { passive: false });

    document.addEventListener('gesturestart', (e) => e.preventDefault());

    /* PWA install prompt */
    let deferredInstall = null;
    const banner = document.getElementById('install-banner');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstall = e;
      if (!localStorage.getItem('suuken-install-dismissed')) {
        banner.classList.add('visible');
      }
    });
    document.getElementById('install-btn').onclick = async () => {
      if (!deferredInstall) return;
      deferredInstall.prompt();
      await deferredInstall.userChoice;
      banner.classList.remove('visible');
      deferredInstall = null;
    };
    document.getElementById('dismiss-install').onclick = () => {
      banner.classList.remove('visible');
      localStorage.setItem('suuken-install-dismissed', '1');
    };

    /* Service worker */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    document.getElementById('celebration-start-btn').onclick = beginGame;

    updateCornerLabels();
    syncCornerUI();
    renderBoard();
  </script>
</body>
</html>
